services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pizzeria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Stabilo4
    volumes:
      - pizzeria_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pizzeria"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PGHOST: db
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:8000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8000,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "node scripts/init_db.js && node scripts/insert_testData.js && node server.js"

  web:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pizzeria_pgdata: