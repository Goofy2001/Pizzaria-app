<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Dashboard</title>
</head>
<body>
    <h1>Front Dashboard</h1>
    <p>Vestiging: <strong id="branchName">-</strong> (ID: <strong id="branchId">-</strong>)</p>

    <h2>Bestellingen</h2>

    <!-- Tabs blijven hetzelfde -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('all')">Alle</button>
        <button class="tab" onclick="switchTab('pending')">Pending</button>
        <button class="tab" onclick="switchTab('paid')">Paid</button>
        <button class="tab" onclick="switchTab('preparing')">Preparing</button>
        <button class="tab" onclick="switchTab('ready')">Ready</button>
        <button class="tab" onclick="switchTab('loaded_for_delivery')">Loaded</button>
        <button class="tab" onclick="switchTab('on_route')">On Route</button>
        <button class="tab" onclick="switchTab('History')">History</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Type</th>
                <th>Driver</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="orderTable">
            <tr><td colspan="6">Laden...</td></tr>
        </tbody>
    </table>

    <h2>Server Messages</h2>
    <div id="messageLog"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        let allOrders = [];
        let currentTab = 'all';
        let BRANCH_ID = null;

        // simpel systeem om branch te kiezen
        function getBranchIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const branchId = urlParams.get('branch_id');
            if (!branchId) {
                alert('Geen branch ID! Gebruik ?branch_id=X in URL');
                return null;
            }
            return parseInt(branchId);
        }
        
        BRANCH_ID = getBranchIdFromURL();
        if (!BRANCH_ID) {
            document.body.innerHTML = `<h1>Geen branch ID in URL</h1>`
            throw new Error('No branch ID');
        }

        //laadt de info per branch
        async function loadBranchInfo() {
            try {
                const response = await fetch(`/api/branch/${BRANCH_ID}`);
                if (!response.ok) {
                    throw new Error('Branch not found');
                }
                const branch = await response.json();
                document.getElementById('branchName').textContent = branch.name;
                document.getElementById('branchId').textContent = branch.id;
                addUpdate(`✅ Ingelogd als ${branch.name}`);
            } catch(err) {
                console.error(err);
                alert(`Vestiging ${BRANCH_ID} niet gevonden!`);
                addUpdate(`❌ Vestiging ${BRANCH_ID} not found`);
            }
        }

        //updaten van de log
        const messageLog = document.getElementById('messageLog');
        
        function addUpdate(message) {
            const update = document.createElement('p');
            const time = new Date().toLocaleTimeString();
            update.textContent = `[${time}] ${message}`;
            messageLog.prepend(update);
            
            while (messageLog.children.length > 50) {
                messageLog.removeChild(messageLog.lastChild);
            }
        }

        //socket.io
        socket.on('connect', () => {
            addUpdate('✅ Verbonden met server');
            loadBranchInfo();
            loadOrders();
        });

        //fetch alle orders op basis van branch id
        async function fetchOrders() {
            try {
                addUpdate('📥 Orders ophalen...');
                const response = await fetch(`/api/orders/branch/${BRANCH_ID}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const orders = await response.json();
                console.log('Fetched orders for branch', BRANCH_ID, ':', orders);
                addUpdate(`✅ ${orders.length} orders geladen`);
                return orders;
            } catch(err) {
                console.error('Error fetching orders:', err);
                addUpdate(`❌ Error: ${err.message}`);
                return [];
            }
        }

        // opmaken van de order voor in de tabel
        const HISTORY_STATUSES = ['delivered', 'picked_up', 'on_table', 'cancelled']
        function renderOrders() {
            const tbody = document.getElementById('orderTable');
            let filteredOrders = allOrders;
            if (currentTab === 'History') {
                filteredOrders = allOrders.filter(order => HISTORY_STATUSES.includes(order.status));
            }else if (currentTab !== 'all') {
                filteredOrders = allOrders.filter(order => order.status === currentTab);
            }
            if (filteredOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">Geen orders</td></tr>';
                return;
            }
            tbody.innerHTML = filteredOrders.map(order => `
                <tr id="order-row-${order.id}">
                    <td><strong>#${order.id}</strong></td>
                    <td>${order.customer_name}</td>
                    <td>${order.type}</td>
                    <td>${order.driver_name || '-'}</td>
                    <td>
                        <span id="status-${order.id}" class="status-badge ${order.status}">${order.status}</span>
                    </td>
                    <td>
                        <div id="buttons-${order.id}">${getActionButton(order)}</div>
                        
                    </td>
                </tr>
            `).join('');
        }
            //knop in tabel afhankelijk van de status van de order
        function getActionButton(order) {
            switch(order.status) {
                case 'pending':
                    return `<button class="action-btn" onclick="updateStatus(${order.id}, 'paid')">Mark Paid</button>`;
                case 'paid':
                    return `<button class="action-btn" onclick="updateStatus(${order.id}, 'preparing')">Start Preparing</button>`;
                case 'preparing':
                    return `<button class="action-btn" onclick="updateStatus(${order.id}, 'ready')">Mark Ready</button>`;
                case 'ready':
                    if (order.type === 'pickup') {
                        return `<button class="action-btn" onclick="updateStatus(${order.id}, 'picked_up')">Mark Picked Up</button>`;
                    } else if(order.type === 'inHouse') {
                        return `<button class="action-btn" onclick="updateStatus(${order.id}, 'on_table')">Put on table</button>`;
                    }
                    else {
                        return `<button class="action-btn" onclick="assignDriver(${order.id})">Assign Driver</button>`;
                    }
                case 'loaded_for_delivery':
                    return `<em>Wacht op driver...</em>`;
                case 'on_route':
                    return `<em>Onderweg...</em>`;
                case 'picked_up':
                case 'on_table':
                case 'delivered':
                    return `<em>✅ Voltooid</em>`;
                default:
                    return '';
            }
        }
        
        // zet de orders in de tabel
        async function loadOrders() {
            allOrders = await fetchOrders();
            renderOrders();
        }
        
        // tabs voor beter overzicht
        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            renderOrders();
        }
        
        socket.on('order:status_changed', (data) => {
            const { order_id, status, order } = data;
            // ✅ Only update if order belongs to THIS branch
            const foundOrder = allOrders.find(o => o.id === order_id);
            if (foundOrder) {
                addUpdate(`🔄 Order ${order_id} → ${status}`);
                foundOrder.status = status;
                if (order && order.driver_name) {
                    foundOrder.driver_name = order.driver_name;
                }
                renderOrders();
                const row = document.getElementById(`order-row-${order_id}`);
                if (row) {
                    row.style.backgroundColor = 'yellow';
                    setTimeout(() => { row.style.backgroundColor = ''; }, 1000);
                }
            }
            // If order not in our list → ignore (different branch)
        });
        
        // database update
        async function updateStatus(orderId, newStatus) {
            try {
                addUpdate(`📤 Update order ${orderId} → ${newStatus}`);
                
                const response = await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const order = allOrders.find(o => o.id === orderId)
                if (order) order.status = newStatus
                addUpdate(`✅ Order ${orderId} updated`);
                renderOrders()
                const row = document.getElementById(`order-row-${orderId}`);
                if (row) {
                    row.style.backgroundColor = 'yellow';
                    setTimeout(() => { row.style.backgroundColor = ''; }, 1000);
                }
            } catch(err) {
                console.error('Error:', err);
                addUpdate(`❌ Error: ${err.message}`);
            }
        }

        
        async function assignDriver(orderId) {
            const driverId = prompt('Driver ID:', '1');
            if (!driverId) return;
            try {
                addUpdate(`📤 Assign driver ${driverId}`);
                const response = await fetch(`/api/orders/${orderId}/assign-driver`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driver_id: parseInt(driverId) })
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error);
                }
                const updatedOrder = await response.json();
                const order = allOrders.find(o => o.id === orderId);
                if (order) {
                    order.status = 'loaded_for_delivery';
                    order.driver_id = parseInt(driverId);
                    order.driver_name = updatedOrder.driver_name;
                }
                addUpdate(`✅ Driver ${driverId} toegewezen aan order ${orderId}`);
                renderOrders();
            } catch(err) {
                console.error('Error:', err);
                addUpdate(`❌ Error: ${err.message}`);
            }
        }
    </script>
</body>
</html>
