<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.io test</title>
</head>
<body>
    <h1>Socket.io test client</h1>
    <h2>Test je socket.io connectie</h2>

    <button onclick="sendHello()">Stuur 'Hello' naar server</button>
    <button onclick="clearLog()">Refresh de chat</button>

    <div id="chat"></div>

    <h2>Teller: <span id="counterValue">0</span></h2>
    <button onclick="increaseCounter()">Verhoog teller</button>

    <h2>Custom events</h2>
    <button onclick="PingPong()">Ping</button>
    <button onclick="getServerTime()">Give me time</button>

    <!--socket io library inladen-->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const logDiv = document.getElementById('chat')

        function addToChat(message) {
            const item = document.createElement('div')
            item.textContent = `[${new Date()}] ${message}`
            logDiv.appendChild(item)
        }

        function clearLog() {
            logDiv.innerHTML = ''
        }
        // maak connectie met de server
        const socket = io()


        // socket.io event messages testing --> client side
        socket.on('connect', function() {
            addToChat(`verbonden met server! Socket id: ${socket.id}`)
        })

        socket.on('disconnect', function() {
            addToChat(`Verbinding verbroken`)
        })

        socket.on('hello_response', function(data) {
            addToChat(`Server antwoordt: ${JSON.stringify(data)}`)
        })

        function sendHello() {
            const message = {text: 'Hallo van de client', timestamp: new Date()}
            socket.emit('hello', message)
            addToChat(`Verzonden naar server: ${JSON.stringify(message)}`)
        }

        // teller functies
        const counterSpan = document.getElementById('counterValue')

        socket.on('counter_update', function(value) {
            counterSpan.textContent = value
        })

        function increaseCounter() {
            socket.emit('counter_increment')
        }

        // custom functions
        function PingPong() {
            socket.emit('ping', "ping")
        }

        socket.on('pong', function() {
            alert("pong")
        })

        function getServerTime() {
            socket.emit('serverTime')
        }

        socket.on('timeFromServer', function(tijd) {
            alert(`Het is ${tijd}`)
        })

        socket.on('user_connected', function(message) {
            alert(`Nieuwe gebruiker verbonden: ${message.id} om ${message.time}`)
        })

    </script>
</body>
</html>
